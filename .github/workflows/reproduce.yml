name: Reproduce frozen study
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make reproduce
      - name: Check tracked outputs are unchanged
        run: git diff --exit-code
